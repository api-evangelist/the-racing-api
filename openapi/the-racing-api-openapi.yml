          \ := \"https://api.theracingapi.com/v1/dams/{dam_id}/analysis/distances?\"\
          \ + params.Encode()\n\n    client := &http.Client{}\n    req, _ := http.NewRequest(\"\
          GET\", url, nil)\n    req.SetBasicAuth(\"USERNAME\", \"PASSWORD\")\n\n \
          \   resp, _ := client.Do(req)\n    defer resp.Body.Close()\n    body, _\
          \ := io.ReadAll(resp.Body)\n    fmt.Println(string(body))\n}"
