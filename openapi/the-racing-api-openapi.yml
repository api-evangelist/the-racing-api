        label: Python3
      - lang: PHP
        source: "<?php\n$username = 'USERNAME';\n$password = 'PASSWORD';\n$url = \"\
          https://api.theracingapi.com/v1/sires/{sire_id}/results\";\n\n$params =\
          \ http_build_query([ ]);\n\n$ch = curl_init(\"$url?$params\");\ncurl_setopt($ch,\
          \ CURLOPT_RETURNTRANSFER, true);\ncurl_setopt($ch, CURLOPT_HTTPAUTH, CURLAUTH_BASIC);\n\
          curl_setopt($ch, CURLOPT_USERPWD, \"$username:$password\");\n\n$response\
          \ = curl_exec($ch);\n\nif (curl_errno($ch)) {\n  echo 'Error:' . curl_error($ch);\n\
          } else {\n  echo $response;\n}\n\ncurl_close($ch);\n?>"
        label: PHP
      - lang: JavaScript
        source: "const username = 'USERNAME';\nconst password = 'PASSWORD';\nconst\
          \ credentials = btoa(`${username}:${password}`);\n\nconst params = new URLSearchParams({});\n\
          const url = `https://api.theracingapi.com/v1/sires/{sire_id}/results?${params}`;\n\
          \nfetch(url, {\n  method: 'GET',\n  headers: {\n    'Authorization': `Basic\
          \ ${credentials}`\n  }\n})\n.then(response => response.json())\n.then(data\
          \ => console.log(data))\n.catch(error => console.error('Error:', error));"
        label: Node.js
      - lang: Ruby
        source: 'require ''net/http''

          require ''uri''

          require ''json''


          params = {}

          uri = URI(''https://api.theracingapi.com/v1/sires/{sire_id}/results'')

          uri.query = URI.encode_www_form(params)


          http = Net::HTTP.new(uri.host, uri.port)

          http.use_ssl = true


          request = Net::HTTP::Get.new(uri)

          request.basic_auth(''USERNAME'', ''PASSWORD'')


          response = http.request(request)

          puts JSON.parse(response.body)'
        label: Ruby
      - lang: Java
        source: "import java.net.http.*;\nimport java.util.Base64;\nimport java.util.Map;\n\
          \nMap<String, String> params = Map.of();\nString credentials = Base64.getEncoder()\n\
          \    .encodeToString(\"USERNAME:PASSWORD\".getBytes());\n\nHttpClient client\
          \ = HttpClient.newHttpClient();\nHttpRequest request = HttpRequest.newBuilder()\n\
          \    .uri(URI.create(\"https://api.theracingapi.com/v1/sires/{sire_id}/results\"\
          ))\n    .header(\"Authorization\", \"Basic \" + credentials)\n    .build();\n\
          \nHttpResponse<String> response = client.send(\n    request, HttpResponse.BodyHandlers.ofString());\n\
          System.out.println(response.body());"
