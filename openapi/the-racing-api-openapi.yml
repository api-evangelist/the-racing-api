        source: 'curl -u USERNAME:PASSWORD https://api.theracingapi.com/v1/sires/{sire_id}/results

          '
        label: cURL
      - lang: Python
        source: 'import requests

          from requests.auth import HTTPBasicAuth


          url = "https://api.theracingapi.com/v1/sires/{sire_id}/results"

