meta:
  title: The Racing API - Documentation
tags:
- name: Introduction
  description: "<section id=\"info_introduction\">\n    <p><b>Welcome to <a href='https://www.theracingapi.com'\
    \ target='_blank'>The Racing API</a></b></p>\n    <p>The Racing API provides a\
    \ set of RESTful JSON endpoints, returning horse racing data from our database\
    \ of over 500,000 results and pre-race racecards. The API is designed to meet\
    \ the needs of application developers, data scientists, businesses and websites\
    \ requiring punctual and accurate horse racing data.</p>\n    <p>This API reference\
    \ contains the technical documentation users will require to connect their integrations\
    \ and third-party applications.</p>\n    <p><b><a href='https://www.theracingapi.com/faq'\
    \ target='_blank'>FAQ</a> | <a href='https://www.theracingapi.com/data-coverage'\
    \ target='_blank'>Data Coverage</a> | <a href='https://www.theracingapi.com/terms-of-service'\
    \ target='_blank'>Terms of Service</a></b></p>\n    <p><b>For support or feature\
    \ requests, please email <a href='mailto:support@theracingapi.com'>support@theracingapi.com</a>.</b></p>\n\
    </section>"
- name: Authentication
  description: "<section id=\"info_authentication\">\n    <p>Once you <a href='https://www.theracingapi.com/#subscribe'\
    \ target='_blank'><b>subscribe to The Racing API</b></a>, you will be able to\
    \ login to your dashboard and view your API username and password.</p>\n    <p>In\
    \ order to authenticate your requests, you should use <b>HTTP Basic Authentication</b>,\
    \ passing your username and password (Base64 encoded) in the <b>Authorization\
    \ header</b> of your request.</p>\n    <p>If your account becomes inactive, your\
    \ invoice payment is overdue or you attempt to access endpoints not available\
    \ to your subscription level, requests will return a <b>401 Unauthorized</b> response.</p>\n\
    </section>"
- name: Rate Limits
  description: "<section id=\"info_rate_limits\">\n    <p>Default limits for the API\
    \ are <b>5 requests per second</b> for paid plans. Free plan users are limited\
    \ to <b>1 request per second</b>.\n    <p>Some endpoints may have higher or lower\
    \ rate limits than the default - these are specified in the documentation for\
    \ each endpoint.</p>\n    <p>Exceeding the rate limit for a given endpoint will\
    \ return a <b>429 Too Many Requests</b> response.\n    <p>Additional IP based\
    \ rate limits are applied via Cloudflare as a protective measure for the services\
    \ endpoints - exceeding these will trigger cooling off periods before requests\
    \ from that IP address are accepted again:</p>\n    <ul>\n        <li><b>>100\
    \ requests received in a 10 second period</b> - 5 minutes cooling off</li>\n \
    \       <li><b>>500 requests received in a 10 second period</b> - 30 minutes cooling\
    \ off</li>\n    </ul>\n    <p>We constantly monitor traffic and may temporarily\
    \ manually block any user's API keys and IP/IP ranges where we detect problematic\
    \ activity - we will notify the user via email if this happens, and reinstate\
    \ access once the problematic activity/excessive requests have ceased.</p>\n</section>"
- name: Endpoint Overview
  description: "<section id=\"info_endpoint_overview\">\n    <h2>Core API</h2>\n \
    \   <p>The Racing API's Core API provides access to our primary horse racing data\
    \ set, containing over three decades of horse racing results and updating with\
    \ the latest data every 5 minutes.</p>\n    <p>This API provides full pre and\
    \ post race data coverage of UK and Irish horse racing, as well as global coverage\
    \ of group level races and selected handicaps. You can view a breakdown of coverage\
    \ by year and region <a href='https://www.theracingapi.com/data-coverage' target='_blank'>here</a></p>\n\
    \    <p>Every user who subscribes to The Racing API gains access to some or all\
    \ of the Core API endpoints, subject to their specific plan level.</p>\n    <p>The\
    \ Core API is divided in to 11 top-level categories:</p>\n    <table>\n      \
    \  <thead>\n            <th>Endpoint Category</th>\n            <th>Description</th>\n\
    \        </thead>\n        <tbody>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Courses'>/courses/</a></td>\n\
    \                <td>Course and region data, such as course names, course ids\
    \ and region codes.</td>\n            </tr>\n            <tr>\n              \
    \  <td><a href='https://api.theracingapi.com/documentation#tag/Dams'>/dams/</a></td>\n\
    \                <td>Dam data and analysis. Dams can be searched for by name and\
    \ results/analysis of their progeny's race performances can be queried by dam\
    \ id.</td>\n            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Damsires'>/damsires/</a></td>\n\
    \                <td>Damsire data and analysis. Damsires can be searched for by\
    \ name and results/analysis of their grand offspring's race performances  can\
    \ be queried by damsire id.</td>\n            </tr>\n            <tr>\n      \
    \          <td><a href='https://api.theracingapi.com/documentation#tag/Horses'>/horses/</a></td>\n\
    \                <td>Horse data and analysis. Horses can be searched for by name\
    \ and results/analysis of their race performances can be queried by horse id.</td>\n\
    \            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Jockeys'>/jockeys/</a></td>\n\
    \                <td>Jockey data and analysis. Jockeys can be searched for by\
    \ name and results/analysis of their race performances can be queried by jockey\
    \ id.</td>\n            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Odds'>/odds/</a></td>\n\
    \                <td>Detailed odds data for a given runner, including price movements.</td>\n\
    \            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Owners'>/owners/</a></td>\n\
    \                <td>Owner data and analysis. Owners can be searched for by name\
    \ and results/analysis of their horse's race performances can be queried by owner\
    \ id.</td>\n            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Racecards'>/racecards/</a></td>\n\
    \                <td>Detailed racecard (pre-race) data.</td>\n            </tr>\n\
    \            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Results'>/results/</a></td>\n\
    \                <td>Detailed results (post-race) data.</td>\n            </tr>\n\
    \            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Sires'>/sires/</a></td>\n\
    \                <td>Sire data and analysis. Sires can be searched for by name\
    \ and results/analysis of their progeny's race performances can be queried by\
    \ sire id.</td>\n            </tr>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Trainers'>/trainers/</a></td>\n\
    \                <td>Trainer data and analysis. Trainers can be searched for by\
    \ name and results/analysis of their horses's race performances can be queried\
    \ by trainer id.</td>\n            </tr>\n        </tbody>\n    </table>\n   \
    \ <h3>Core API Endpoints By Plan Level</h3>\n    <p>We have also grouped the core\
    \ API endpoints by plan level to make it easier to find the endpoints relevant\
    \ to your API key permissions:</p>\n    <ul>\n        <li><a href='#tag/Free-Plan'>Free\
    \ Plan endpoints</a></li>\n        <li><a href='#tag/Basic-Plan'>Basic Plan endpoints</a></li>\n\
    \        <li><a href='#tag/Standard-Plan'>Standard Plan endpoints</a></li>\n \
    \       <li><a href='#tag/Pro-Plan'>Pro Plan endpoints</a></li>\n    </ul>\n \
    \   <h3>Analysis Endpoints</h3>\n    <p>The Core API's analysis endpoints perform\
    \ data aggregation to return helpful betting & probability insights.</p>\n   \
    \ <p>The statistics returned by these endpoints include:</p>\n    <ul>\n    <li><b>Win\
    \ Percentage (win_%):</b> The number of wins divided by total runs/rides for a\
    \ given query. For example, a win_% figure of 0.18 represents an 18% win percentage.</li>\n\
    \    <li><b>1 Unit Profit/Loss (1_pl):</b> Profit/loss for total rides/runs for\
    \ a given query, if a 1 unit stake was placed at SP.</li>\n    <li><b>Actual/Expected\
    \ (a/e):</b> Actual number of wins, divided by expected number of wins for a given\
    \ query. Expected number of wins is calculated from SP. For a detailed explanation\
    \ of this statistic, see <a href='https://ratingtheraces.com/blog/information/what-is-the-ae-statistic/#:~:text=A%2FE%20stands%20for%20Actual%20over%20Expected.&text=In%20this%20process%20we%20take,of%201%2F3.0%20%3D%200.33.'\
    \ target='_blank'>here</a>.</li>\n    </ul>\n    <p><b>IMPORTANT NOTE:</b> Anaysis\
    \ endpoints only perform data aggregation on results for which SP odds are available.</p>\n\
    \    <h2>Regional API's</h2>\n    <p>The Regional APIs provide access to additional\
    \ data sets that provide complete coverage for a given region. The data and fields\
    \ returned are also much more specific to that region than they may be in the\
    \ Core API.</p>\n    <p>Accessing the endpoints for these data sets requires purchasing\
    \ the relevant regional data add-on for your plan, which can be requested by emailing\
    \ <b><a href='mailto:support@theracingapi.com'>support@theracingapi.com</a></b>.</p>\n\
    \    <p>The following top-level regional endpoints are available:\n     <table>\n\
    \        <thead>\n            <th>Region</th>\n            <th>Description</th>\n\
    \        </thead>\n        <tbody>\n            <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/Australia'>/australia/</a></td>\n\
    \                <td>Meets and races for Australia</td>\n            </tr>\n \
    \           <tr>\n                <td><a href='https://api.theracingapi.com/documentation#tag/North-America'>/north-america/</a></td>\n\
    \                <td>Meets, entries and results for the USA and Canada</td>\n\
    \            </tr>\n        </tbody>\n    </table>\n</section>"
- name: Changelog
  description: "<section id=\"info_changelog\">\n    <h3>v1.4.3 (Current - February\
    \ 2026)</h3>\n    <ul>\n        <li><b>OpenAPI Response Examples</b> - Added rich\
    \ response examples to Pydantic models for all regions</li>\n        <li><b>Pydantic\
    \ v2 Migration</b> - Upgraded to Pydantic 2 with model updates</li>\n        <li><b>Analytics\
    \ Backend Optimization</b> - New synchronised columnar database for results data,\
    \ utilised by analysis endpoints for substantially improved performance</li>\n\
    \        <li><b>Default Date Parameters</b> - Results endpoints now include default\
    \ date parameters</li>\n    </ul>\n    <h3>v1.4.2 (January 2026)</h3>\n    <ul>\n\
    \        <li><b>Async Database Operations</b> - Full async migration for database\
    \ operations</li>\n        <li><b>Enhanced Documentation</b> - Code examples and\
    \ endpoints organized by plan level</li>\n        <li><b>Improved Error Tracking</b>\
    \ - Optimized error tracing</li>\n    </ul>\n    <h3>v1.4.1 (December 2025)</h3>\n\
    \    <ul>\n        <li><b>Autoscaling</b> - Added dynamic worker scaling</li>\n\
    \        <li><b>Enhanced Error Monitoring</b> - Improved error tracking and monitoring</li>\n\
    \        <li><b>Database Compression</b> - Added compression for database connections</li>\n\
    \        <li><b>Australia Date Validation</b> - Improved date handling for Australia\
    \ endpoints</li>\n    </ul>\n    <h3>v1.4.0 (August-October 2025)</h3>\n    <ul>\n\
    \        <li><b>Australia Regional API</b> - Full Australia racing data support\
    \ (meets, races, runners)</li>\n        <li><b>Australia Historical Results Add-on</b>\
    \ - Historical data access as add-on feature</li>\n        <li><b>Odds History</b>\
    \ - Optional bookmaker odds history</li>\n    </ul>\n    <h3>v1.3.1 (June-July\
    \ 2025)</h3>\n    <ul>\n        <li><b>Response Compression</b> - GZip compression\
    \ middleware</li>\n        <li><b>Faster Serialization</b> - Optimized JSON serialization\
    \ for responses</li>\n        <li><b>Racecard Sorting</b> - Improved racecard\
    \ ordering</li>\n        <li><b>Health Check Endpoint</b> - Added /health endpoint</li>\n\
    \    </ul>\n    <h3>v1.3.0 (July-August 2023)</h3>\n    <ul>\n        <li><b>North\
    \ America Regional API</b> - Full North America racing data support (meets, entries,\
    \ results)</li>\n        <li><b>Meets Endpoint</b> - Track meet information</li>\n\
    \        <li><b>Racecard Summaries</b> - Lightweight racecard summary endpoint</li>\n\
    \        <li><b>Jumps Racing Filter</b> - Filter racecards by jumps/flat racing</li>\n\
    \    </ul>\n    <h3>v1.2.0 (April-June 2023)</h3>\n    <ul>\n        <li><b>Odds\
    \ Data</b> - Live odds data for racecards</li>\n        <li><b>Pro Tier</b> -\
    \ New Pro subscription tier with advanced features</li>\n        <li><b>Pro Add-on\
    \ Support</b> - Add-on purchases for additional features</li>\n        <li><b>Big\
    \ Races Endpoints</b> - Featured/notable race identification</li>\n        <li><b>Endpoint\
    \ Deprecation System</b> - Managed deprecation for API versioning</li>\n    </ul>\n\
    \    <h3>v1.1.0 (February-March 2023)</h3>\n    <ul>\n        <li><b>Region Support</b>\
    \ - GB/IE region filtering for results</li>\n        <li><b>Today's Results</b>\
    \ - Dedicated today's results endpoint</li>\n        <li><b>Historic Results</b>\
    \ - Date range queries for historical data</li>\n        <li><b>Big Races Feature</b>\
    \ - Big race entries identification</li>\n        <li><b>Silk URLs</b> - Jockey\
    \ silk image URLs in responses</li>\n    </ul>\n    <h3>v1.0.0 (January 2023 -\
    \ Initial Release)</h3>\n    <ul>\n        <li><b>Core API</b> - FastAPI-based\
    \ REST API</li>\n        <li><b>API Authentication</b> - Secure authentication\
    \ system</li>\n        <li><b>Racecards Endpoints</b> - Basic and advanced racecards</li>\n\
    \        <li><b>Courses Endpoint</b> - List courses with region filtering</li>\n\
    \        <li><b>Results Endpoints</b> - Horse racing results</li>\n        <li><b>Error\
    \ Tracking</b> - Integrated error tracking</li>\n    </ul>\n</section>"
