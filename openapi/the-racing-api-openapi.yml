          \ := \"https://api.theracingapi.com/v1/sires/{sire_id}/results?\" + params.Encode()\n\
          \n    client := &http.Client{}\n    req, _ := http.NewRequest(\"GET\", url,\
          \ nil)\n    req.SetBasicAuth(\"USERNAME\", \"PASSWORD\")\n\n    resp, _\
