          const url = `https://api.theracingapi.com/v1/dams/{dam_id}/analysis/distances?${params}`;\n\
          \nfetch(url, {\n  method: 'GET',\n  headers: {\n    'Authorization': `Basic\
          \ ${credentials}`\n  }\n})\n.then(response => response.json())\n.then(data\
          \ => console.log(data))\n.catch(error => console.error('Error:', error));"
