    - name: racing-api-results-today
      description: The Racing API Results Today
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: the-racing-basic-plan.resultstodayv1resultstodayget
      with:
        region: tools.region
        limit: tools.limit
        skip: tools.skip
      outputParameters:
      - type: object
        mapping: $.
