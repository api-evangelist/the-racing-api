naftiko: 1.0.0-alpha2
info:
  label: The Racing API — Courses
  description: 'The Racing API — Courses. 2 operations. Lead operation: The Racing API Courses. Self-contained Naftiko capability
    covering one The Racing Api business surface.'
  tags:
  - The Racing Api
  - Courses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THE_RACING_API_API_KEY: THE_RACING_API_API_KEY
capability:
  consumes:
  - type: http
    namespace: the-racing-courses
    baseUri: https://api.theracingapi.com
    description: The Racing API — Courses business capability. Self-contained, no shared references.
    resources:
    - name: v1-courses
      path: /v1/courses
      operations:
      - name: coursesv1coursesget
        method: GET
        description: The Racing API Courses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: region_codes
          in: query
          type: string
          description: Filter courses by region codes. Get the full list <a href='https://api.theracingapi.com/documentation#tag/Courses/operation/list_regions_v1_courses_regions_get'
    - name: v1-courses-regions
      path: /v1/courses/regions
      operations:
      - name: regionsv1coursesregionsget
        method: GET
        description: The Racing API Regions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.THE_RACING_API_USER}}'
      password: '{{env.THE_RACING_API_PASS}}'
  exposes:
  - type: rest
    namespace: the-racing-courses-rest
    port: 8080
    description: REST adapter for The Racing API — Courses. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/courses
      name: v1-courses
      description: REST surface for v1-courses.
      operations:
      - method: GET
        name: coursesv1coursesget
        description: The Racing API Courses
        call: the-racing-courses.coursesv1coursesget
        with:
          region_codes: rest.region_codes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/courses/regions
      name: v1-courses-regions
      description: REST surface for v1-courses-regions.
      operations:
      - method: GET
        name: regionsv1coursesregionsget
        description: The Racing API Regions
        call: the-racing-courses.regionsv1coursesregionsget
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: the-racing-courses-mcp
    port: 9090
    transport: http
    description: MCP adapter for The Racing API — Courses. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: racing-api-courses
      description: The Racing API Courses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: the-racing-courses.coursesv1coursesget
      with:
        region_codes: tools.region_codes
      outputParameters:
      - type: object
        mapping: $.
    - name: racing-api-regions
      description: The Racing API Regions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: the-racing-courses.regionsv1coursesregionsget
      outputParameters:
      - type: object
        mapping: $.
